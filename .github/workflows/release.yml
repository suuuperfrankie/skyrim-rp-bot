name: Build and Release

# Triggers on any tag matching v* (e.g. v0.3.2, v1.0.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/update GitHub releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build .exe + dist folder
        run: npm run build

      - name: Zip distribution folder
        shell: pwsh
        run: |
          $zip = "SkyrimRPBot-${{ github.ref_name }}.zip"
          Compress-Archive -Path dist/SkyrimRPBot/* -DestinationPath "dist/$zip"
          Get-ChildItem "dist/$zip" | Format-List

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SkyrimRPBot-${{ github.ref_name }}.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
